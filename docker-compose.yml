services:
  ops-console:
    build: .
    container_name: hqsoft-ops-console
    ports:
      - "4000:4000"
    volumes:
      # Lưu bền "Báo cáo SLA hàng tháng" (khách hàng gửi cuối tháng, nhập tay/import vào tool)
      # — nếu KHÔNG mount volume này, dữ liệu sẽ mất mỗi khi container bị xoá/deploy lại.
      - ./data:/app/data
    environment:
      - PORT=4000
      - SESSION_SECRET=doi-chuoi-nay-thanh-gia-tri-bi-mat-cua-ban
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123@
      # - COOKIE_SECURE=1   # bat khi da chay sau HTTPS reverse proxy

      # --- Ket noi ERP (dang nhap bang email/mat khau, khong can API key) ---
      - ERP_BASE_URL=https://erp.hqsoft.vn
      - ERP_USER=email-dang-nhap-erp@hqsoft.vn
      - ERP_PASS=mat-khau-erp-that

      # --- Ket noi Jira khach hang (du an ABI) - dung API token, khong dung mat khau ---
      # Tao token tai: https://id.atlassian.com/manage-profile/security/api-tokens
      - JIRA_BASE_URL=https://vnservicedesk.atlassian.net
      - JIRA_EMAIL=email-co-quyen-xem-queue-425@hqsoft.vn
      - JIRA_API_TOKEN=jira-api-token-that
    restart: unless-stopped
