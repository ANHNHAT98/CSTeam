<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cài đặt — HQSOFT Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2138; --blueprint:#1F4E79; --blueprint-deep:#0F2138;
    --paper:#EEF2F6; --panel:#FFFFFF;
    --grid-line:rgba(31,78,121,.14); --grid-line-strong:rgba(31,78,121,.28);
    --muted:#5B7089; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
    background-image:linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:32px 32px; min-height:100vh;
  }
  .ops-topbar{background:#12233D;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;}
  .ops-topbar a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;opacity:.9;}
  .ops-topbar a:hover{opacity:1;text-decoration:underline;}
  .ops-topbar .crumb{font-size:12px;color:#B9C6D6;font-family:monospace;}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 28px 60px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
  .layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start;}
  .nav{background:var(--panel);border:1px solid var(--grid-line-strong);border-radius:var(--radius);padding:8px;position:sticky;top:12px;}
  .nav-group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-family:'IBM Plex Mono',monospace;}
  .nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .nav button:hover{background:rgba(31,78,121,.06);}
  .nav button.active{background:rgba(31,78,121,.1);color:var(--blueprint);font-weight:600;}
  .nav .desc{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .frame-box{background:var(--panel);border:1px solid var(--grid-line-strong);border-radius:var(--radius);overflow:hidden;min-height:420px;}
  .frame-head{padding:12px 16px;border-bottom:1px solid var(--grid-line);display:flex;align-items:center;gap:10px;}
  .frame-head b{font-size:14.5px;} .frame-head a{margin-left:auto;font-size:12.5px;color:var(--muted);}
  iframe{display:block;width:100%;border:0;height:600px;background:var(--paper);}
  @media (max-width:860px){ .layout{grid-template-columns:1fr;} .nav{position:static;} .wrap{padding:16px;} }
</style>
</head>
<body>
<div class="ops-topbar">
  <a href="/">← Quay về</a>
  <span class="crumb">Cài đặt</span>
</div>
<div class="wrap">
  <h1>⚙ Cài đặt</h1>
  <p class="sub">Gom các phần cấu hình gửi tự động (lịch cron-job.org, mail qua Power Automate, Zalo) vào một chỗ, tách khỏi các trang báo cáo.</p>
  <div class="layout">
    <div class="nav" id="nav">
      <div class="nav-group">Báo cáo tuần ERP</div>
      <button type="button" data-k="erp">🤖 Tự động gửi ERP<span class="desc">Ghi Note báo cáo tuần vào ERP theo lịch</span></button>
      <button type="button" data-k="nhac-sla">📧 Nhắc SLA đầu tuần<span class="desc">Mail ticket trễ SLA cho từng thành viên</span></button>
      <div class="nav-group">Jira ABI</div>
      <button type="button" data-k="frt">🔔 Cảnh báo First Response<span class="desc">Mail / Zalo khi ticket sắp trễ phản hồi</span></button>
    </div>
    <div class="frame-box">
      <div class="frame-head"><b id="fTitle">—</b><a id="fOpen" href="#" target="_blank" rel="noopener">Mở riêng tab mới ↗</a></div>
      <iframe id="frame" title="Cấu hình"></iframe>
    </div>
  </div>
</div>
<script>
const ITEMS = {
  'erp':      { title:'🤖 Tự động gửi ERP', src:'/bao-cao/tuan-erp?cfg=auto', page:'/bao-cao/tuan-erp' },
  'nhac-sla': { title:'📧 Nhắc SLA đầu tuần', src:'/bao-cao/tuan-erp?cfg=sla', page:'/bao-cao/tuan-erp' },
  'frt':      { title:'🔔 Cảnh báo First Response — Jira ABI', src:'/tickets/sla-jira-abi?cfg=alert', page:'/tickets/sla-jira-abi' },
};
const frame = document.getElementById('frame');
let ro = null;
function fit(){
  try{
    const d = frame.contentDocument; if (!d || !d.body) return;
    frame.style.height = Math.max(420, d.documentElement.scrollHeight) + 'px';
  }catch(_){}
}
frame.addEventListener('load', () => {
  fit();
  try{
    const d = frame.contentDocument;
    if (ro) ro.disconnect();
    ro = new ResizeObserver(fit); ro.observe(d.body);
    // nếu phiên hết hạn, trang con bị chuyển về trang đăng nhập → mở ở cửa sổ chính
    if (frame.contentWindow.location.pathname === '/') location.href = '/?next=' + encodeURIComponent(location.pathname + location.hash);
  }catch(_){}
});
function show(k){
  if (!ITEMS[k]) k = 'erp';
  const it = ITEMS[k];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.k === k));
  document.getElementById('fTitle').textContent = it.title;
  document.getElementById('fOpen').href = it.src;
  if (frame.getAttribute('src') !== it.src) { frame.style.height = '600px'; frame.setAttribute('src', it.src); }
  if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k);
}
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => show(b.dataset.k)));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
