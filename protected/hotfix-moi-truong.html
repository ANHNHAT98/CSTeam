<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotfix — Môi trường SQL Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{--ink:#12233D;--blueprint:#1F4E79;--paper:#EEF2F6;--panel:#FFFFFF;--grid-line:rgba(31,78,121,.14);--grid-line-strong:rgba(31,78,121,.28);--amber:#E8A33D;--success:#3F7D58;--danger:#B23A48;--muted:#5B7089;--radius:10px;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;
    background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:32px 32px;}
  .ops-topbar{background:#12233D;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;}
  .ops-topbar a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;opacity:.9;}
  .ops-topbar a:hover{opacity:1;text-decoration:underline;}
  .ops-topbar .crumb{font-size:12px;color:#B9C6D6;font-family:monospace;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.6;}
  .panel{background:var(--panel);border:1px solid var(--grid-line-strong);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .bar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;}
  .field select,.field input[type=text]{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);padding:8px 12px;border-radius:8px;border:1px solid var(--grid-line-strong);background:#fff;min-width:220px;}
  button{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--blueprint);background:#fff;color:var(--blueprint);cursor:pointer;font-weight:600;}
  button.primary{background:var(--blueprint);color:#fff;}
  button.export{border-color:var(--success);color:var(--success);}
  button.danger{border-color:var(--danger);color:var(--danger);}
  button.danger.arm{background:var(--danger);color:#fff;}
  button.sm{padding:4px 10px;font-size:12.5px;}
  button:disabled{opacity:.5;cursor:default;}
  .msg{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px;line-height:1.55;}
  .msg.err{background:#FBE9EB;border:1px solid #E3A7AF;color:#8B2A36;} .msg.info{background:#EAF1F8;border:1px solid var(--grid-line-strong);} .msg.ok{background:#EAF5EE;border:1px solid #B5D8C3;color:#2C5E43;} .msg.warn{background:#FFF6E3;border:1px solid #EBCB8B;color:#7A5410;}
  .msg a{color:inherit;font-weight:700;}
  .badge{font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px;background:#E4EBF3;color:var(--blueprint);letter-spacing:.03em;white-space:nowrap;}
  .badge.PRODUCTION{background:#FBE9EB;color:#8B2A36;} .badge.UAT{background:#FFF3DC;color:#8A5A0B;} .badge.DEV,.badge.TEST{background:#EAF5EE;color:#2C5E43;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;border-bottom:2px solid var(--grid-line-strong);padding-bottom:8px;}
  .tab{display:flex;gap:7px;align-items:center;padding:7px 13px;border:1px solid var(--grid-line-strong);border-radius:8px 8px 0 0;background:#fff;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);}
  .tab.on{background:var(--blueprint);color:#fff;border-color:var(--blueprint);} .tab.on .badge{background:#fff;}
  .tab small{font-weight:500;opacity:.75;}
  .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px;}
  .head h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0;}
  .meta{color:var(--muted);font-size:12px;margin-top:4px;}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
  th{background:#1F4E79;color:#fff;text-align:left;padding:8px 12px;font-weight:600;}
  td{padding:7px 12px;border-bottom:1px solid var(--grid-line);vertical-align:top;word-break:break-word;}
  td.k{width:24%;font-weight:600;} td.v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;white-space:pre-wrap;width:34%;}
  td.lk{font-size:13.5px;line-height:1.55;} td.lk a,td.v a{color:var(--blueprint);} td.t{width:84px;text-align:right;white-space:nowrap;}
  tr.g td{background:#D0D8E8;font-weight:700;color:#0F2B66;border-bottom:1px solid #fff;}
  tr.i td.k{padding-left:26px;}
  .empty{color:var(--muted);padding:34px 0;text-align:center;font-size:14px;line-height:1.7;}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.6;}
  table.ed td{padding:4px 6px;}
  table.ed input[type=text],table.ed select,table.ed textarea{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--grid-line-strong);border-radius:6px;background:#fff;color:var(--ink);}
  table.ed textarea{resize:vertical;min-height:56px;line-height:1.45;overflow:hidden;}
  table.ed{table-layout:fixed;} table.ed select{padding:6px 4px;} table.ed td{padding:5px 7px;vertical-align:top;} table.ed input[type=text],table.ed select{height:40px;}
  table.ed tr.i input[data-f=key]{font-weight:600;}
  table.ed textarea,table.ed input[type=text],table.ed select{font-size:14px !important;}
  table.ed textarea[data-f=value]{font-family:'IBM Plex Mono',monospace;}
  table.ed tr.g input{font-weight:700;background:#EDF1F8;}
  table.ed td.c{white-space:nowrap;text-align:center;}
  .paste{margin-top:10px;display:none;border:1px dashed var(--grid-line-strong);border-radius:8px;padding:12px;background:#F8FAFC;} .paste.on{display:block;}
  .paste textarea{width:100%;min-height:150px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:8px 10px;border:1px solid var(--grid-line-strong);border-radius:8px;}
  .row2{display:grid;grid-template-columns:1fr 1fr 170px;gap:12px;margin-bottom:12px;}
  @media(max-width:700px){.row2{grid-template-columns:1fr;}}
  .row2 .field input,.row2 .field select{min-width:0;width:100%;}
</style>
</head>
<body>
<div class="ops-topbar"><a href="/">← HQSoft Ops Console</a><span class="crumb" id="crumb">/ hotfix / môi trường sql build</span></div>
<div class="wrap">
  <h1 id="h1">Môi trường SQL Build</h1>
  <p class="sub" id="sub">Chọn <b>dự án</b> để xem các môi trường đã tạo (UAT, PRODUCTION…): <b>copy</b> thông tin hoặc <b>xuất Excel</b>. Bấm <b>＋ Thêm mới</b> để tạo môi trường, <b>Sửa</b> để chỉnh rồi <b>Lưu</b> — dữ liệu được commit lên Git của tool.</p>

  <div class="panel">
    <div class="bar">
      <label class="field" id="fProjBox">Dự án
        <select id="fProject"></select>
      </label>
      <label class="field" id="fSearchBox">Tìm kiếm
        <input type="text" id="fSearch" placeholder="Tên môi trường, server, DB, link…">
      </label>
      <button type="button" class="primary" id="btnNew">＋ Thêm mới</button>
      <button type="button" class="export" id="btnExportAll">⬇ Xuất Excel (theo bộ lọc)</button>
      <button type="button" id="btnTemplate" title="File Excel mẫu để điền rồi Import ở phần Thêm mới / Sửa">⬇ Template Excel</button>
    </div>
  </div>

  <div id="msg"></div>
  <div class="panel" id="detail"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url, opt){
  const r = await fetch(url, opt); const j = await r.json().catch(()=>({error:'Phản hồi không hợp lệ (HTTP '+r.status+')'}));
  if(r.status===401){ location.href='/?next='+encodeURIComponent(location.pathname+location.search); throw new Error('Phiên đăng nhập đã hết'); }
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
const send = (method, url, body) => api(url, { method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
const say = (kind, text) => { $('msg').innerHTML = text ? '<div class="msg '+kind+'">'+text+'</div>' : ''; };

/* ---------- dữ liệu ---------- */
const LOCK = new URLSearchParams(location.search).get('project') || ''; // mở từ menu Dự án → chỉ làm việc với 1 dự án
const KINDS_DEFAULT = ['UAT','PRODUCTION','DEV','TEST','DEMO','Khác'];
let items = [], kinds = KINDS_DEFAULT, projLabels = {}, sel = null, draft = null, armDelete = false, githubBacked = false;
let pending = null; // các dòng đã đọc từ file Excel import (chờ bấm Thay / Thêm)
const pLabel = c => projLabels[c] || c;
const GROUPS = ['database','backoffice','sfa','service sales','api ecom','api ge','image','hangfire','promotion'];
const g = (key) => ({ type:'group', key, value:'', link:'' });
const it = (key) => ({ type:'item', key, value:'', link:'' });
const TEMPLATE = () => [g('Database'), it('Server'), it('DB Name'),
  g('BackOffice'), it('Link Cloud'), it('Account'), it('Password'),
  g('SFA'), g('Service Sales'), it('ProjectCode'),
  g('API Ecom'), it('API link'), g('API GE'), it('API link'),
  g('Image'), it('SFA'),
  g('Hangfire'), it('Hangfire'), g('Promotion'), it('Hangfire')];

async function load(keepSel){
  const [d, p] = await Promise.all([api('/api/sql-env'), api('/api/ticket-instructions').catch(()=>[])]);
  items = d.items || []; githubBacked = !!d.githubBacked; if(Array.isArray(d.kinds) && d.kinds.length) kinds = d.kinds;
  projLabels = {}; p.forEach(x => { projLabels[x.code] = x.label || x.name || x.code; });
  if(!keepSel || !items.some(x=>x.id===sel)) sel = null;
  if(LOCK) applyLock(); else renderFilter();
  render();
}
function applyLock(){
  const n = pLabel(LOCK);
  $('h1').textContent = 'Môi trường dự án — '+n; document.title = 'Môi trường dự án — '+n;
  $('crumb').textContent = '/ dự án / '+n.toLowerCase()+' / môi trường dự án';
  $('sub').innerHTML = 'Các môi trường đã tạo của dự án <b>'+esc(n)+'</b> (UAT, PRODUCTION…): <b>copy</b> thông tin hoặc <b>xuất Excel</b>. Bấm <b>＋ Thêm mới</b> để tạo môi trường, <b>Sửa</b> để chỉnh rồi <b>Lưu</b> — dữ liệu được commit lên Git của tool.';
  $('fProjBox').style.display = 'none'; $('fSearchBox').style.display = 'none';
}
const kindRank = k => { const i = kinds.indexOf(k); return i<0 ? 99 : i; };
const projectCodes = () => [...new Set([...Object.keys(projLabels), ...items.map(x=>x.project)])].sort((a,b)=>pLabel(a).localeCompare(pLabel(b),'vi'));
function renderFilter(){
  const cur = $('fProject').value; const codes = projectCodes();
  $('fProject').innerHTML = '<option value="">Tất cả dự án ('+items.length+')</option>' + codes.map(c=>'<option value="'+esc(c)+'">'+esc(pLabel(c))+' ('+items.filter(x=>x.project===c).length+')</option>').join('');
  $('fProject').value = codes.includes(cur) ? cur : '';
}
const curProject = () => LOCK || $('fProject').value;
const envMatch = (e, q) => [pLabel(e.project), e.name, e.kind, e.note].concat(e.rows.flatMap(r=>[r.key, r.value, r.link||''])).join(' ').toLowerCase().includes(q);
function filtered(){
  const p = curProject(), q = LOCK ? '' : $('fSearch').value.trim().toLowerCase();
  return items.filter(e=>(!p || e.project===p) && (!q || envMatch(e,q)))
    .sort((a,b)=>pLabel(a.project).localeCompare(pLabel(b.project),'vi') || kindRank(a.kind)-kindRank(b.kind) || a.name.localeCompare(b.name,'vi'));
}

/* ---------- hiển thị ---------- */
const confirmDiscard = () => confirm('Bạn đang sửa dở. Bỏ thay đổi chưa lưu?');
const fmtTime = s => { if(!s) return ''; const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('vi-VN'); };
const linkHtml = t => String(t||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>esc(l).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')).join('<br>');
const clone = e => JSON.parse(JSON.stringify({ id:e.id, project:e.project, name:e.name, kind:e.kind, note:e.note||'', rows:e.rows.map(r=>({type:r.type,key:r.key,value:r.value,link:r.link||''})) }));
const startNew = () => { draft = { project: curProject(), name:'', kind:'UAT', note:'', rows: TEMPLATE() }; pending = null; say('',''); render(); };

function render(){
  if(draft) return renderEditor();
  const box = $('detail'); const envs = filtered(); const p = curProject();
  const scope = (p ? pLabel(p) : 'Tất cả dự án') + ' — ' + envs.length + ' môi trường';
  if(!envs.length){
    box.innerHTML = '<div class="head"><h2>'+esc(scope)+'</h2></div><div class="empty">'+(items.length && !p ? 'Không có môi trường nào khớp tìm kiếm.' : 'Chưa có môi trường nào'+(p?' cho dự án này':'')+'.<br>Bấm <b>＋ Thêm mới</b> để tạo (có thể <b>Import Excel</b> theo template).')+'</div>';
    return;
  }
  const e = envs.find(x=>x.id===sel) || envs[0]; sel = e.id;
  const tabs = '<div class="tabs">'+envs.map(x=>'<div class="tab'+(x.id===e.id?' on':'')+'" data-tab="'+esc(x.id)+'">'+(p?'':'<small>'+esc(pLabel(x.project))+' ·</small>')+'<span>'+esc(x.name)+'</span><span class="badge '+esc(x.kind)+'">'+esc(x.kind)+'</span></div>').join('')+'</div>';
  const body = e.rows.map((r,i)=>{
    if(r.type==='group') return '<tr class="g"><td colspan="2">'+esc(r.key)+'</td><td colspan="2" style="text-align:right;white-space:nowrap"><button type="button" class="sm" data-gt="'+i+'" title="Copy văn bản của nhóm này">📋 Văn bản</button> <button type="button" class="sm" data-gb="'+i+'" title="Copy bảng của nhóm này">📋 Bảng</button> <button type="button" class="sm" data-gi="'+i+'" title="Copy ảnh bảng của nhóm này">🖼 Ảnh</button></td></tr>';
    const v = /^https?:\/\//i.test(r.value) ? '<a href="'+esc(r.value)+'" target="_blank" rel="noopener">'+esc(r.value)+'</a>' : esc(r.value);
    return '<tr class="i"><td class="k">'+esc(r.key)+'</td><td class="v">'+v+'</td><td class="lk">'+linkHtml(r.link)+'</td><td class="t">'+(r.value?'<button type="button" class="sm" data-cp="'+i+'" title="Copy nội dung">📋</button> ':'')+(r.link?'<button type="button" class="sm" data-cpl="'+i+'" title="Copy link / đính kèm">🔗</button>':'')+'</td></tr>';
  }).join('');
  box.innerHTML = '<div class="head"><div><h2>'+esc(scope)+'</h2></div></div>'+tabs
    +'<div class="head"><div><div class="meta" style="margin:0">'+(e.updatedAt?'Cập nhật '+esc(fmtTime(e.updatedAt))+(e.updatedBy?' bởi '+esc(e.updatedBy):''):'')+'</div>'+(e.note?'<div class="meta" style="color:var(--ink)">📝 '+esc(e.note)+'</div>':'')+'</div>'
    +'<div class="acts"><button type="button" class="primary sm" id="bCopyT" title="Dán vào Excel / Word (ô chat chỉ nhận chữ — dùng Copy ảnh)">📋 Copy bảng</button><button type="button" class="sm" id="bCopyX" title="Dán vào Zalo / chat dạng chữ">📋 Copy văn bản</button><button type="button" class="sm" id="bCopyI" title="Ảnh bảng có kẻ viền — dán được vào Zalo, chat, Word, PowerPoint">🖼 Copy ảnh</button><button type="button" class="export sm" id="bXls">⬇ Excel</button><button type="button" class="sm" id="bEdit">✏️ Sửa</button><button type="button" class="sm" id="bDup">⎘ Nhân bản</button><button type="button" class="danger sm'+(armDelete?' arm':'')+'" id="bDel">'+(armDelete?'Bấm lần nữa để xoá':'🗑 Xoá')+'</button></div></div>'
    +'<table><thead><tr><th>Tiêu đề</th><th>Nội dung</th><th>Link / Đính kèm</th><th></th></tr></thead><tbody>'+body+'</tbody></table>';
  box.querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ sel = t.dataset.tab; armDelete = false; render(); });
  box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{ const r = e.rows[Number(b.dataset.cp)]; const ok = await copyText(r.value); say(ok?'ok':'err', ok?'Đã copy <b>'+esc(r.key)+'</b>.':'Trình duyệt chặn copy.'); });
  box.querySelectorAll('[data-cpl]').forEach(b=>b.onclick=async()=>{ const r = e.rows[Number(b.dataset.cpl)]; const ok = await copyText(r.link); say(ok?'ok':'err', ok?'Đã copy link / đính kèm của <b>'+esc(r.key)+'</b>.':'Trình duyệt chặn copy.'); });
  $('bCopyT').onclick = () => copyEnv(e, 'table'); $('bCopyX').onclick = () => copyEnv(e, 'text');
  box.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>copyEnv(e, 'text', Number(b.dataset.gt)));
  box.querySelectorAll('[data-gb]').forEach(b=>b.onclick=()=>copyEnv(e, 'table', Number(b.dataset.gb)));
  box.querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>copyImage(e, Number(b.dataset.gi)));
  $('bCopyI').onclick = () => copyImage(e);
  $('bXls').onclick = () => exportExcel([e]);
  $('bEdit').onclick = () => { draft = clone(e); pending = null; say('',''); render(); };
  $('bDup').onclick = () => { draft = clone(e); delete draft.id; draft.name = e.name + ' (bản sao)'; pending = null; say('info','Đang tạo bản sao — chỉnh rồi bấm <b>Lưu</b>.'); render(); };
  $('bDel').onclick = async () => {
    if(!armDelete){ armDelete = true; render(); setTimeout(()=>{ if(armDelete){ armDelete = false; if(!draft) render(); } }, 4000); return; }
    try{ const r = await send('DELETE','/api/sql-env/'+encodeURIComponent(e.id)); armDelete = false; sel = null; await load(true); saved('Đã xoá môi trường.', r); }catch(err){ say('err', esc(err.message)); }
  };
}
/** Sau khi lưu/xoá thành công không hiện thông báo — chỉ tải lại màn hình lọc với dữ liệu mới. Chỉ cảnh báo khi server chưa cấu hình Git (dữ liệu chưa được commit). */
function saved(text, r){
  if(r && r.commitUrl || githubBacked) say('','');
  else say('warn', '<b>Chưa commit lên Git</b> vì server chưa cấu hình <code>GITHUB_TOKEN</code> / <code>GITHUB_REPO</code> — dữ liệu mới chỉ lưu trên server và có thể mất khi deploy lại.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- soạn thảo (dùng chung cho Thêm mới và Sửa) ---------- */
function projField(d){
  if(LOCK) return '<div class="field">Dự án<input type="text" value="'+esc(pLabel(LOCK))+'" disabled></div>';
  const codes = projectCodes(); const other = d.project && !codes.includes(d.project);
  return '<div class="field">Dự án<select id="eProjSel">'+codes.map(c=>'<option value="'+esc(c)+'"'+(c===d.project?' selected':'')+'>'+esc(pLabel(c))+'</option>').join('')+'<option value="__other__"'+(other?' selected':'')+'>➕ Dự án khác…</option></select><input type="text" id="eProject" value="'+esc(other?d.project:'')+'" placeholder="Nhập tên dự án mới" style="margin-top:6px;'+(other?'':'display:none')+'"></div>';
}
let syncDraft = () => {};
function renderEditor(){
  const d = draft; const box = $('detail');
  const rows = d.rows.map((r,i)=>'<tr class="'+(r.type==='group'?'g':'i')+'" data-i="'+i+'"><td class="c" style="width:68px;padding:5px 2px"><button type="button" class="sm" style="padding:4px 6px" data-up="'+i+'" title="Lên">▲</button><button type="button" class="sm" style="padding:4px 6px" data-dn="'+i+'" title="Xuống">▼</button></td>'
    +'<td style="width:84px"><select data-f="type"><option value="item"'+(r.type==='item'?' selected':'')+'>Mục</option><option value="group"'+(r.type==='group'?' selected':'')+'>Nhóm</option></select></td>'
    +'<td><input type="text" data-f="key" value="'+esc(r.key)+'" placeholder="'+(r.type==='group'?'Tên nhóm (vd: Database)':'Tiêu đề (vd: Server, API Ecom)')+'"></td>'
    +(r.type==='group'

/* ---------- đọc file Excel import thành các dòng ---------- */
const TYPE_WORDS = { 'nhóm':'group', 'nhom':'group', 'group':'group', 'mục':'item', 'muc':'item', 'item':'item' };
function parseTable(table){
  const rows = table.map(r=>r.map(c=>String(c==null?'':c).trim()));
  let map = null, start = 0;
  for(let i=0;i<Math.min(rows.length,3) && !map;i++){
    const r = rows[i].map(c=>c.toLowerCase());
    const k = r.findIndex(c=>/^(tiêu đề|items?)$/.test(c)), v = r.findIndex(c=>/^(nội dung|info)$/.test(c));
    if(k>=0 && v>=0){ map = { type: r.findIndex(c=>/^loại/.test(c)), key:k, value:v, link: r.findIndex(c=>/^link/.test(c)) }; start = i+1; }
  }
  const data = rows.slice(start).filter(r=>r.some(c=>c));
  if(!map){ // không có dòng tiêu đề: nếu cột đầu toàn "Nhóm/Mục" thì có cột Loại, ngược lại là Tiêu đề/Nội dung/Link
    const hasType = data.length && data.every(r=>!r[0] || (r[0].toLowerCase() in TYPE_WORDS));
    map = hasType ? { type:0, key:1, value:2, link:3 } : { type:-1, key:0, value:1, link:2 };
  }
  const out = [];
  data.forEach(r=>{
    const cell = i => (i>=0 && r[i]) || '';
    const key = cell(map.key), value = cell(map.value), link = cell(map.link);
    if(!key && !value && !link) return;
    const t = map.type>=0 ? TYPE_WORDS[cell(map.type).toLowerCase()] : null;
    if(!value && !link && /^(tk|mk)$/i.test(key) && t!=='group') return; // mỗi người dùng user riêng — bỏ TK/MK trống
    if(t==='group' || (!t && !value && !link && GROUPS.includes(key.toLowerCase()))) out.push(g(key));
    else out.push({ type:'item', key, value, link });
  });
  return out;
}
async function importFile(file){
  if(!file) return;
  try{
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const names = wb.SheetNames.filter(n=>!/^(tổng hợp|hướng dẫn)$/i.test(n));
    if(!names.length) throw new Error('File không có sheet dữ liệu.');
    const pick = $('sheetPick'); $('pasteBox').classList.add('on');
    const loadSheet = (name) => {
      const table = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'', raw:false });
      pending = parseTable(table);
      $('pasteTxt').value = pending.map(r=>(r.type==='group'?'[Nhóm] ':'')+r.key+(r.value||r.link?'\t'+r.value+(r.link?'\t'+r.link.replace(/\s*\n+\s*/g,' ; '):''):'')).join('\n');
      say(pending.length?'info':'err', pending.length ? 'Đã đọc <b>'+pending.length+' dòng</b> từ sheet <b>'+esc(name)+'</b> của file <b>'+esc(file.name)+'</b>. Bấm <b>Thay toàn bộ các dòng</b> hoặc <b>Thêm vào cuối</b> để áp dụng.' : 'Sheet <b>'+esc(name)+'</b> không có dòng dữ liệu hợp lệ (cần cột Tiêu đề / Nội dung / Link — tải Template Excel để xem mẫu).');
    };
    if(names.length>1){ pick.style.display = ''; pick.innerHTML = names.map(n=>'<option>'+esc(n)+'</option>').join(''); pick.onchange = () => loadSheet(pick.value); }
    else pick.style.display = 'none';
    loadSheet(names[0]);
  }catch(err){ say('err','Không đọc được file Excel: '+esc(err.message)); }
}

/* ---------- copy / xuất ---------- */
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
/** Các dòng của 1 nhóm (từ dòng nhóm đến trước nhóm kế tiếp); gi = null → cả môi trường. */
const rowsOf = (e, gi) => { if(gi==null) return e.rows; let j = gi+1; while(j<e.rows.length && e.rows[j].type!=='group') j++; return e.rows.slice(gi, j); };
function envText(e, gi){
  const rows = rowsOf(e, gi); const lines = gi==null ? [pLabel(e.project)+' — '+e.name+' ('+e.kind+')'] : [];
  rows.forEach(r=>{ if(r.type==='group'){ if(lines.length) lines.push(''); lines.push('['+r.key+']'); } else if(r.key || r.value || r.link){ lines.push(r.key+': '+[r.value, r.link ? 'Link: '+String(r.link).replace(/\s*\n+\s*/g,' ; ') : ''].filter(Boolean).join(' | ')); } });
  return lines.join('\n');
}
const flat = t => String(t||'').replace(/[\t\r\n]+/g,' ');
function envTsv(e, gi){ return ['Tiêu đề\tNội dung\tLink / Đính kèm'].concat(rowsOf(e, gi).map(r=>r.type==='group' ? r.key+'\t\t' : r.key+'\t'+flat(r.value)+'\t'+flat(r.link))).join('\n'); }
/** HTML dạng bảng có kẻ viền + màu như giao diện (gắn border/bgcolor/width trực tiếp để Word, Excel, PowerPoint, Zalo giữ đúng khi dán). */
function envHtml(e, gi){
  const W = [190, 330, 330], B = '#9FB0C4';
  const cell = 'font-family:Arial;font-size:11pt;padding:6px 9px;border:1px solid '+B+';vertical-align:top';
  const th = (t,w) => '<th width="'+w+'" bgcolor="#1F4E79" align="left" style="'+cell+';width:'+w+'px;background:#1F4E79;color:#FFFFFF;text-align:left"><font color="#FFFFFF"><b>'+t+'</b></font></th>';
  const rows = rowsOf(e, gi).map(r=>r.type==='group'
    ? '<tr><td colspan="3" bgcolor="#D0D8E8" style="'+cell+';background:#D0D8E8;color:#0F2B66;font-weight:bold"><b>'+esc(r.key)+'</b></td></tr>'
    : '<tr><td width="'+W[0]+'" style="'+cell+';width:'+W[0]+'px;padding-left:22px;font-weight:bold"><b>'+esc(r.key)+'</b></td><td width="'+W[1]+'" style="'+cell+';width:'+W[1]+'px">'+esc(r.value).replace(/\n/g,'<br>')+'</td><td width="'+W[2]+'" style="'+cell+';width:'+W[2]+'px">'+linkHtml(r.link)+'</td></tr>').join('');
  return '<table border="1" cellspacing="0" cellpadding="6" width="'+(W[0]+W[1]+W[2])+'" style="border-collapse:collapse;border:1px solid '+B+';font-family:Arial;font-size:11pt"><tr>'+th('Tiêu đề',W[0])+th('Nội dung',W[1])+th('Link / Đính kèm',W[2])+'</tr>'+rows+'</table>';
}
async function copyEnv(e, mode, gi){
  let ok; const what = gi==null ? '<b>'+esc(e.name)+'</b>' : 'nhóm <b>'+esc(e.rows[gi].key)+'</b> của '+esc(e.name);
  if(mode==='table'){
    try{ await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([envHtml(e, gi)],{type:'text/html'}), 'text/plain': new Blob([envTsv(e, gi)],{type:'text/plain'}) })]); ok = true; }
    catch(_){ ok = await copyText(envTsv(e, gi)); }
  } else ok = await copyText(envText(e, gi));
  say(ok?'ok':'err', ok ? 'Đã copy '+what+(mode==='table'?' dạng bảng có kẻ viền — dán vào Excel / Word. (Zalo / chat chỉ nhận chữ nên sẽ ra dạng tab; muốn đúng bảng hãy dùng 🖼 Copy ảnh.)':' dạng văn bản — dán vào Zalo / chat.') : 'Trình duyệt chặn copy.');
}
/** Ảnh PNG của bảng có kẻ viền (giống nút Copy bảng) — dán được vào mọi nơi, kể cả Zalo / chat không nhận bảng HTML. Không copy được vào clipboard thì tải file PNG. */
async function copyImage(e, gi){
  const what = gi==null ? '<b>'+esc(e.name)+'</b>' : 'nhóm <b>'+esc(e.rows[gi].key)+'</b> của '+esc(e.name);
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;padding:14px;width:fit-content';
  box.innerHTML = (gi==null ? '<div style="font:bold 12pt Arial;color:#0F2B66;margin-bottom:8px">'+esc(pLabel(e.project)+' — '+e.name+' ('+e.kind+')')+'</div>' : '')+envHtml(e, gi);
  document.body.appendChild(box);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(box, { scale:2, backgroundColor:'#ffffff', useCORS:true });
    const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
    try{ await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); say('ok','Đã copy '+what+' <b>dạng ảnh</b> — dán (Ctrl/Cmd + V) vào Zalo, chat, Word hoặc PowerPoint.'); }
    catch(_){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'MoiTruong_'+(e.name||'bang').replace(/[^\w\-]+/g,'_')+'.png'; document.body.appendChild(a); a.click(); a.remove(); say('info','Trình duyệt không cho copy ảnh nên đã <b>tải file PNG</b> về máy — kéo file vào Zalo / chat.'); }
  }catch(err){ say('err','Không tạo được ảnh: '+esc(err.message)); }
  finally{ box.remove(); }
}
function sheetName(e, used){
  let n = (pLabel(e.project)+' - '+e.name).replace(/[\\\/?*\[\]:]/g,' ').replace(/\s+/g,' ').trim().slice(0,31).trim() || 'Sheet';
  let k = n, c = 2; while(used.has(k.toLowerCase())){ const suf = ' ('+c++ +')'; k = n.slice(0,31-suf.length).trim()+suf; }
  used.add(k.toLowerCase()); return k;
}
const XLS_HEAD = ['Loại','Tiêu đề','Nội dung','Link / Đính kèm'];
const xlsRows = rows => [XLS_HEAD].concat(rows.map(r=>[r.type==='group'?'Nhóm':'Mục', r.key, r.value||'', r.link||'']));
const xlsSheet = rows => { const ws = XLSX.utils.aoa_to_sheet(xlsRows(rows)); ws['!cols'] = [{wch:8},{wch:26},{wch:56},{wch:56}]; return ws; };
/** File xuất ra dùng đúng định dạng của template nên Import lại được ở phần Thêm mới / Sửa. */
function exportExcel(list){
  if(!list.length){ say('err','Không có môi trường nào để xuất.'); return; }
  const wb = XLSX.utils.book_new(); const used = new Set();
  if(list.length>1){
    const rows = [['Dự án','Môi trường','Loại','Server','Ghi chú','Cập nhật','Người cập nhật']].concat(list.map(e=>{ const s = e.rows.find(x=>x.type==='item' && /^(server|ip db|ip)$/i.test(x.key) && x.value); return [pLabel(e.project), e.name, e.kind, s?s.value:'', e.note||'', fmtTime(e.updatedAt), e.updatedBy||'']; }));
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{wch:22},{wch:30},{wch:12},{wch:28},{wch:36},{wch:20},{wch:24}];
    XLSX.utils.book_append_sheet(wb, ws, 'Tổng hợp'); used.add('tổng hợp');
  }
  list.forEach(e=>XLSX.utils.book_append_sheet(wb, xlsSheet(e.rows), sheetName(e, used)));
  const safe = s => String(s).replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, list.length===1 ? 'MoiTruong_'+safe(pLabel(list[0].project))+'_'+safe(list[0].name)+'.xlsx' : 'MoiTruong_SQL_Build_'+stamp+'.xlsx');
  say('ok','Đã xuất Excel ('+list.length+' môi trường).');
}

  XLSX.utils.book_append_sheet(wb, xlsSheet(rows), 'Template');
  const guide = [['Hướng dẫn dùng template'],[''],
    ['1. Sheet "Template": mỗi dòng là 1 Tiêu đề — Nội dung — Link / Đính kèm của môi trường.'],
    ['2. Cột "Loại": Nhóm = dòng tiêu đề nhóm (vd: Database, BackOffice, Hangfire); Mục = dòng thông tin. Để trống thì tool tự nhận nhóm theo tên quen thuộc.'],
    ['3. Cột "Nội dung": server, tài khoản, mật khẩu… (nhập chữ thường, không bị che). Cột "Link / Đính kèm": URL hoặc ghi chú file đính kèm; nhiều link thì mỗi link 1 dòng trong ô.'],

  const ws = XLSX.utils.aoa_to_sheet(guide); ws['!cols'] = [{wch:130}];
  XLSX.utils.book_append_sheet(wb, ws, 'Hướng dẫn');
  XLSX.writeFile(wb, 'Template_Moi_Truong_SQL_Build.xlsx');
  say('ok','Đã tải <b>Template Excel</b>. Điền xong vào <b>＋ Thêm mới</b> (hoặc Sửa) → <b>📥 Import file Excel</b>.');
}

/* ---------- sự kiện ---------- */
$('btnNew').onclick = () => { if(draft && !confirmDiscard()) return; startNew(); };
$('btnExportAll').onclick = () => exportExcel(filtered());
$('btnTemplate').onclick = downloadTemplate;
let lastProj = '';
$('fProject').onchange = () => { if(draft && !confirmDiscard()){ $('fProject').value = lastProj; return; } lastProj = $('fProject').value; draft = null; sel = null; armDelete = false; render(); };
$('fSearch').oninput = () => { if(!draft) render(); };
window.addEventListener('beforeunload', e => { if(draft){ e.preventDefault(); e.returnValue = ''; } });
load().catch(err => say('err', 'Không tải được dữ liệu: '+esc(err.message)));
</script>
