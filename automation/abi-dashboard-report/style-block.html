<style>
  :root {
    --ink: #1F2D38;
    --sub: #6B7C88;
    --line: #E4E9ED;
    --bg: #F3F6F8;
    --card: #FFFFFF;
    --accent: #2E6F95;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: Arial, "Helvetica Neue", sans-serif;
    color: var(--ink);
  }

  /* ---------- upload bar ---------- */
  .toolbar {
    max-width: 1220px;
    margin: 0 auto;
    padding: 20px 32px 0;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .toolbar h2 { font-size: 18px; margin: 0; flex: 1 1 auto; min-width: 220px; }
  .file-btn {
    background: var(--card);
    border: 1.5px dashed var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  .file-btn:hover { background: #EAF2F6; }
  #fileInput { display: none; }
  .png-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 13.5px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }
  .png-btn:hover { background: #255B7C; }
  .html-btn {
    background: #fff;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }
  .html-btn:hover { background: #EAF2F6; }
  .status { font-size: 12.5px; color: var(--sub); width: 100%; }
  .status.err { color: #B5533C; font-weight: 700; }

  .empty-state {
    max-width: 1220px;
    margin: 60px auto;
    padding: 60px 32px;
    text-align: center;
    color: var(--sub);
  }
  .empty-state .big { font-size: 44px; margin-bottom: 10px; }

  /* ---------- dashboard (mirrors generate_dashboard.py output) ---------- */
  #dashboard { display: none; }
  .page { max-width: 1220px; margin: 0 auto; padding: 20px 32px 36px; }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 3px solid var(--accent); padding-bottom: 14px; margin-bottom: 20px;
  }
  .header h1 { font-size: 25px; margin: 0 0 4px 0; letter-spacing: 0.2px; }
  .header .sub { color: var(--sub); font-size: 13px; }
  .header .badge {
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    padding: 7px 16px; border-radius: 20px; white-space: nowrap;
  }
  .kpi-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .kpi {
    flex: 1 1 0; min-width: 110px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 14px 12px; border-top: 4px solid var(--accent);
  }
  .kpi.warn { border-top-color: #B5533C; }
  .kpi.ok { border-top-color: #5FA778; }
  .kpi.info { border-top-color: #E3A857; }
  .kpi.danger { border-top-color: #8B2E2E; }
  .kpi.danger .num { color: #8B2E2E; }
  .kpi .num { font-size: 26px; font-weight: 700; line-height: 1; }
  .kpi .label { font-size: 11.5px; color: var(--sub); margin-top: 6px; }
  .grid { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .grid .card { flex: 1 1 280px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h3 { font-size: 13.5px; margin: 0 0 12px 0; color: var(--ink); text-transform: uppercase; letter-spacing: 0.4px; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .legend-label { flex: 1; color: var(--ink); }
  .legend-val { font-weight: 700; }
  .legend-pct { color: var(--sub); font-weight: 400; }
  .hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12.5px; }
  .hbar-label { width: 78px; color: var(--sub); flex: none; }
  .hbar-track { flex: 1; background: #EEF2F4; border-radius: 5px; height: 12px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 5px; }
  .hbar-val { width: 22px; text-align: right; font-weight: 700; flex: none; }
  .vbar-wrap { display: flex; align-items: flex-end; gap: 8px; padding-top: 4px; }
  .vbar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .vbar-val { font-size: 11px; font-weight: 700; margin-bottom: 4px; color: var(--ink); }
  .vbar-bar { width: 62%; border-radius: 4px 4px 0 0; min-height: 2px; }
  .vbar-label { font-size: 10px; color: var(--sub); margin-top: 6px; text-align: center; line-height: 1.3; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12.3px; }
  thead th {
    text-align: left; color: var(--sub); font-weight: 700; font-size: 11px;
    text-transform: uppercase; padding: 6px 8px; border-bottom: 2px solid var(--line);
  }
  tbody td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .cell-key { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .cell-summary { max-width: 340px; }
  .cell-deadline { color: var(--sub); white-space: nowrap; }
  .days-hot { color: #B5533C; font-weight: 700; }
  .days-warm { color: #C08A2A; font-weight: 700; }
  .days-cool { color: var(--sub); font-weight: 700; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff; }
  .chip-urgent { background: #8B2E2E; }
  .chip-critical { background: #B5533C; }
  .chip-high { background: #E3A857; color: #4A3A17; }
  .chip-medium { background: #2E6F95; }
  .chip-low { background: #8FA6B3; }
  .section-title { font-size: 14.5px; font-weight: 700; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-title .tag { background: #FCEFE9; color: #B5533C; font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 700; }
  .footer { margin-top: 18px; font-size: 11px; color: var(--sub); text-align: right; }
  @media (max-width: 980px) {
    .kpi-row { flex-wrap: wrap; }
    .kpi { flex: 1 1 30%; }
    .grid { flex-direction: column; }
  }

  /* ---------- ops console top bar (thêm để đồng bộ với trang chính) ---------- */
  .ops-topbar {
    background: #12233D;
    color: #fff;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: Arial, "Helvetica Neue", sans-serif;
  }
  .ops-topbar a {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: .9;
  }
  .ops-topbar a:hover { opacity: 1; text-decoration: underline; }
  .ops-topbar .crumb {
    font-size: 12px;
    color: #B9C6D6;
    font-family: monospace;
  }
</style>
